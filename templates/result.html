<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Interview Result - Virtual Interview Assistant &amp; Evaluating System</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #f1f5f9,
                #e0e7ff
            );
            color: #1e293b;
            min-height: 100vh;
        }


        /* ==========================================
           HEADER
        ========================================== */

        header {
            background: linear-gradient(
                135deg,
                #111827,
                #1e3a8a
            );

            color: white;

            padding: 18px 6%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow:
                0 4px 15px rgba(15, 23, 42, 0.18);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            font-size: 27px;
        }

        .brand-text {
            font-size: 20px;
            font-weight: 700;
        }

        .header-label {
            font-size: 14px;
            color: #dbeafe;
        }


        /* ==========================================
           MAIN CONTAINER
        ========================================== */

        .container {
            width: 92%;
            max-width: 1100px;

            margin: 40px auto 60px;
        }


        /* ==========================================
           RESULT HERO
        ========================================== */

        .result-header {
            background: white;

            border-radius: 20px;

            padding: 35px 30px;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(15, 23, 42, 0.08);

            margin-bottom: 25px;
        }

        .result-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #dbeafe;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 34px;
        }

        .result-header h1 {
            font-size: 30px;
            color: #0f172a;
            margin-bottom: 8px;
        }

        #candidateName {
            color: #64748b;
            font-size: 16px;
        }


        /* ==========================================
           INTERVIEW INFO
        ========================================== */

        .info-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;

            margin-bottom: 25px;
        }

        .info-card {
            background: white;

            border-radius: 16px;

            padding: 22px;

            box-shadow:
                0 8px 25px rgba(15, 23, 42, 0.07);
        }

        .info-label {
            display: block;

            font-size: 13px;

            color: #64748b;

            margin-bottom: 7px;

            text-transform: uppercase;

            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 18px;

            font-weight: 700;

            color: #1e3a8a;
        }


        /* ==========================================
           SCORE SECTION
        ========================================== */

        .score-section {
            background: white;

            border-radius: 20px;

            padding: 35px;

            display: grid;

            grid-template-columns:
                220px 1fr;

            gap: 35px;

            align-items: center;

            margin-bottom: 25px;

            box-shadow:
                0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .score-circle {
            width: 180px;
            height: 180px;

            border-radius: 50%;

            margin: auto;

            background: linear-gradient(
                135deg,
                #2563eb,
                #1e3a8a
            );

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            color: white;

            box-shadow:
                0 10px 25px rgba(37, 99, 235, 0.25);
        }

        .score-number {
            font-size: 46px;

            font-weight: 800;

            line-height: 1;
        }

        .score-label {
            margin-top: 8px;

            font-size: 14px;

            color: #dbeafe;
        }

        .summary-content h2 {
            font-size: 22px;

            margin-bottom: 12px;

            color: #0f172a;
        }

        #summary {
            color: #475569;

            font-size: 16px;

            line-height: 1.7;
        }


        /* ==========================================
           QUESTION RESULTS
        ========================================== */

        .questions-section {
            background: white;

            border-radius: 20px;

            padding: 30px;

            box-shadow:
                0 10px 30px rgba(15, 23, 42, 0.08);

            margin-bottom: 25px;
        }

        .section-title {
            margin-bottom: 25px;

            color: #0f172a;

            font-size: 23px;
        }

        .question-result {
            border: 1px solid #e2e8f0;

            border-radius: 16px;

            padding: 22px;

            margin-bottom: 18px;

            background: #f8fafc;
        }

        .question-result:last-child {
            margin-bottom: 0;
        }

        .question-heading {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 18px;
        }

        .question-heading h3 {
            color: #1e3a8a;

            font-size: 17px;
        }

        .question-score {
            background: #dbeafe;

            color: #1d4ed8;

            padding: 7px 13px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: 700;

            white-space: nowrap;
        }

        .answer-block {
            margin-bottom: 15px;
        }

        .answer-block:last-child {
            margin-bottom: 0;
        }

        .answer-label {
            display: block;

            font-size: 13px;

            font-weight: 700;

            color: #475569;

            margin-bottom: 7px;
        }

        .answer-text {
            background: white;

            border: 1px solid #e2e8f0;

            border-radius: 10px;

            padding: 12px 14px;

            color: #334155;

            line-height: 1.6;

            font-size: 14px;

            word-break: break-word;
        }

        .feedback-box {
            background: #eff6ff;

            border-left: 4px solid #2563eb;

            padding: 12px 14px;

            border-radius: 8px;

            color: #334155;

            font-size: 14px;

            line-height: 1.6;
        }


        /* ==========================================
           NO RESULT
        ========================================== */

        .empty-result {
            text-align: center;

            padding: 35px 20px;

            color: #64748b;
        }


        /* ==========================================
           ACTION BUTTONS
        ========================================== */

        .actions {
            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;
        }

        .btn {
            border: none;

            border-radius: 10px;

            padding: 13px 24px;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .btn-primary {
            background: #2563eb;

            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;

            transform: translateY(-1px);
        }

        .btn-secondary {
            background: white;

            color: #334155;

            border: 1px solid #cbd5e1;
        }

        .btn-secondary:hover {
            background: #f8fafc;
        }


        /* ==========================================
           FOOTER
        ========================================== */

        footer {
            text-align: center;

            padding: 20px;

            color: #64748b;

            font-size: 13px;
        }


        /* ==========================================
           RESPONSIVE DESIGN
        ========================================== */

        @media (max-width: 750px) {

            header {
                padding: 16px 5%;
            }

            .header-label {
                display: none;
            }

            .container {
                width: 94%;

                margin-top: 25px;
            }

            .result-header {
                padding: 28px 20px;
            }

            .result-header h1 {
                font-size: 25px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .score-section {
                grid-template-columns: 1fr;

                text-align: center;

                padding: 28px 20px;
            }

            .questions-section {
                padding: 22px 17px;
            }

            .question-heading {
                align-items: flex-start;

                flex-direction: column;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header>

    <div class="brand">

        <span class="brand-icon">
            🎯
        </span>

        <span class="brand-text">
            Virtual Interview Assistant
        </span>

    </div>

    <div class="header-label">
        Interview Performance
    </div>

</header>


<!-- ==========================================
     MAIN CONTENT
========================================== -->

<main class="container">


    <!-- RESULT HEADER -->

    <section class="result-header">

        <div class="result-icon">
            🏆
        </div>

        <h1>
            Interview Completed
        </h1>

        <p id="candidateName">
            Candidate
        </p>

    </section>


    <!-- INTERVIEW INFORMATION -->

    <section class="info-grid">

        <div class="info-card">

            <span class="info-label">
                Interview Domain
            </span>

            <span
                class="info-value"
                id="domain">
            </span>

        </div>


        <div class="info-card">

            <span class="info-label">
                Difficulty Level
            </span>

            <span
                class="info-value"
                id="difficulty">
            </span>

        </div>

    </section>


    <!-- SCORE + SUMMARY -->

    <section class="score-section">


        <div class="score-circle">

            <span
                class="score-number"
                id="score">
                0
            </span>

            <span class="score-label">
                Overall Score
            </span>

        </div>


        <div class="summary-content">

            <h2>
                Performance Summary
            </h2>

            <p id="summary">
                Loading your interview result...
            </p>

        </div>

    </section>


    <!-- QUESTION RESULTS -->

    <section class="questions-section">

        <h2 class="section-title">
            Question-wise Results
        </h2>

        <div id="results"></div>

    </section>


    <!-- ACTIONS -->

    <div class="actions">

        <button
            class="btn btn-primary"
            onclick="goToInterview()">

            🚀 Start New Interview

        </button>


        <button
            class="btn btn-secondary"
            onclick="logout()">

            Logout

        </button>

    </div>


</main>


<footer>

    Virtual Interview Assistant
    &nbsp;•&nbsp;
    Keep practicing. Keep improving.

</footer>


<script>


/* ==========================================
   LOCAL STORAGE DATA
========================================== */

const firstName =
    localStorage.getItem("first_name");

const domain =
    localStorage.getItem("interview_domain");

const difficulty =
    localStorage.getItem("interview_difficulty");

const resultData =
    localStorage.getItem("interview_result");


/* ==========================================
   CANDIDATE INFORMATION
========================================== */

document.getElementById(
    "candidateName"
).textContent =
    "Candidate: " +
    (firstName || "Candidate");


document.getElementById(
    "domain"
).textContent =
    domain || "Not available";


document.getElementById(
    "difficulty"
).textContent =
    difficulty || "Not available";


/* ==========================================
   RESULT DATA
========================================== */

if (!resultData) {

    document.getElementById(
        "summary"
    ).textContent =
        "No interview result found.";

    document.getElementById(
        "results"
    ).innerHTML =

        '<div class="empty-result">' +
        'No question-wise result is available.' +
        '</div>';

}
else {

    try {

        const data =
            JSON.parse(resultData);


        /* ==========================================
           OVERALL SCORE
        ========================================== */

        document.getElementById(
            "score"
        ).textContent =
            data.score ?? 0;


        /* ==========================================
           SUMMARY / FEEDBACK
        ========================================== */

        document.getElementById(
            "summary"
        ).textContent =
            data.feedback ||
            data.summary ||
            "Interview completed successfully.";


        /* ==========================================
           QUESTION RESULTS
        ========================================== */

        const results =
            document.getElementById(
                "results"
            );


        if (
            data.results &&
            data.results.length > 0
        ) {

            data.results.forEach(
                function(item, index) {


                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "question-result";


                    div.innerHTML =

                        `
                        <div class="question-heading">

                            <h3>
                                Question ${index + 1}
                            </h3>

                            <span class="question-score">
                                Score: ${item.score ?? 0}
                            </span>

                        </div>


                        <div class="answer-block">

                            <span class="answer-label">
                                Question
                            </span>

                            <div class="answer-text">
                                ${item.question || ""}
                            </div>

                        </div>


                        <div class="answer-block">

                            <span class="answer-label">
                                Your Answer
                            </span>

                            <div class="answer-text">
                                ${item.answer || "No answer provided"}
                            </div>

                        </div>


                        <div class="answer-block">

                            <span class="answer-label">
                                Expected Answer
                            </span>

                            <div class="answer-text">
                                ${
                                    item.expected_answer ||
                                    "Expected answer not available"
                                }
                            </div>

                        </div>


                        <div class="answer-block">

                            <span class="answer-label">
                                Feedback
                            </span>

                            <div class="feedback-box">
                                ${
                                    item.feedback ||
                                    "No feedback available."
                                }
                            </div>

                        </div>
                        `;


                    results.appendChild(div);

                }
            );

        }
        else {

            results.innerHTML =

                '<div class="empty-result">' +
                'No question-wise results are available.' +
                '</div>';

        }

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "summary"
        ).textContent =
            "Unable to load interview result.";

        document.getElementById(
            "results"
        ).innerHTML =

            '<div class="empty-result">' +
            'There was a problem loading the result.' +
            '</div>';

    }

}


/* ==========================================
   NEW INTERVIEW
========================================== */

function goToInterview() {

    window.location.href =
        "/interview";

}


/* ==========================================
   LOGOUT
========================================== */

function logout() {

    localStorage.clear();

    window.location.href =
        "/login";

}

</script>


</body>

</html>
